# Thin wrapper over the Piensa IT standard deploy. Actions builds, Netlify only
# publishes the already-compiled site. The reusable carries the four protections
# (credentials checked first, empty publish dir refused, bundle asserts, errors
# that name the missing secret). See
# https://github.com/piensa-it/.github/blob/main/docs/DEPLOY.md
name: Deploy a producción

on:
  push:
    branches: [main]
  # Re-deploy the current head of main without inventing an empty commit.
  workflow_dispatch:

# A second merge waits for the first; simultaneous deploys can publish out of
# order and leave production on the older commit.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    uses: piensa-it/.github/.github/workflows/reusable-deploy.yml@v1
    with:
      # Must match quality-gate.yml's node_version, or the commit that was
      # tested is not the commit that ships.
      node_version: "22"
      install_command: "npm ci"
      # This is a Storybook docs site, not an SPA: the build emits a static
      # multi-file directory, so there is no _redirects/SPA-fallback concern.
      build_command: "npm run build-storybook"
      publish_dir: "storybook-static"
      environment_name: "production"
      environment_url: "https://illustrations.piensait.com"
      # No backend env vars: the docs site has no runtime configuration, so
      # build_env_map / required_build_vars / bundle_assert_vars stay empty.
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
