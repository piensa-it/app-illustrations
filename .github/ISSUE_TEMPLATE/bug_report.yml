name: Bug report
description: Report a reproducible problem with a component or asset.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping us improve Piensa IT Illustrations.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the component, props, and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Share code, a repository, or precise reproduction steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, React version, operating system, and bundler.

